jcpp = "1.4.14"
tracy = "0.13.1"
retroFuturaBootstrap = "1.1.0"

lombok = "1.18.46"
jetbrainsAnnotations = "26.0.2"
fastutil = "8.5.18"
joml = "1.10.8"
