name: Umbra build

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  umbra-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - run: .github/scripts/umbra-build.sh
