
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@30d03306cd2dbfade5083f5c6552afad5321d2bb
    with:
      disable-spotless-pr: true
    secrets: inherit

  sdl-gpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run SDL-GPU tests
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" ./gradlew --build-cache --stacktrace --continue :sdl-gpu:glsmSdlTest :sdl-gpu:sdlGpuDeviceTest
      - name: Attach SDL-GPU test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sdl-gpu-test-results
          path: |
            sdl-gpu/build/test-results/
            sdl-gpu/build/reports/tests/
